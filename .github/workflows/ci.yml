name: VyaparVoice CI & 60-Case Eval Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-evaluate:
    name: Preflight Gates, 60-Case Eval & Pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository with full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure local main ref exists for render.yaml diff gate
        run: |
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run 13-Gate Stage Preflight & Formatting Hygiene Audit
        run: |
          python scripts/preflight.py

      - name: Run 60-Case Multilingual Voice, Guardrail & Grounding Benchmark
        run: |
          python scripts/eval_benchmark.py --assert-targets

      - name: Run Full End-to-End Pytest Suite
        run: |
          pytest -v
