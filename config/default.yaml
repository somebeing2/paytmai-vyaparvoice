app:
  name: "PaytmAI VyaparVoice"
  version: "1.4.0"
  public_deploy_default: false
  live_demo_url: "https://paytmai-vyaparvoice.onrender.com"

sessions:
  isolate_visitors: true
  cookie_name: "vyaparvoice_sid"
  header_name: "X-Demo-Session"
  ttl_seconds: 1800
  max_active_sessions: 64
  max_session_db_bytes: 2097152
  max_total_sessions_bytes: 33554432
  storage_dir: "app/sessions_db"

economics:
  default_gross_margin_pct: 30.0
  paytm_promo_fee_pct: 5.0
  steady_state_campaigns_per_month: 0.782
  steady_state_redeemed_gmv_monthly_inr: 2040.0
  max_discount_floor_pct: 22.0
  cooldown_days: 14
  min_cap_inr: 50
  max_cap_inr: 2500
  cap_presets_inr: [150, 250, 300, 400, 500]
  saas_addon_monthly_inr: 79.0
  credit_referral_monthly_inr: 77.0
  slm_monthly_cogs_inr: 1.80
  tts_cached_monthly_cogs_inr: 3.20
  tts_uncached_monthly_cogs_inr: 27.00
  messaging_monthly_cogs_inr: 43.00
  paytm_merchant_subscriptions_cr: 1.64

experiment:
  default_allocation_ratio: 4.0
  alpha_two_sided: 0.05
  target_power: 0.80
  cap_overrun_warn_threshold: 0.10
  assumed_redemption_rates:
    CMP-WINBACK-01: 0.375
    CMP-DEADHOUR-02: 0.407
    default: 0.35

groq:
  enabled: false
  base_url: "https://api.groq.com/openai/v1"
  model: "llama-3.1-8b-instant"
  timeout_seconds: 6.0
  max_calls_per_session: 20
